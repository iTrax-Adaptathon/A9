<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncSlot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<section id="appointment-form" class="form-section">

    <h2>Create New Appointment</h2>

    <form onsubmit="saveAppointment(event)">

        <label for="title">Appointment Title</label>
        <input
            type="text"
            id="title"
            placeholder="Enter appointment title"
            required
        >

        <label for="date">Date</label>
        <input
            type="date"
            id="date"
            required
        >

        <label for="time">Time</label>
        <input
            type="time"
            id="time"
            required
        >

        <label for="members">Team Members</label>
        <input
            type="text"
            id="members"
            placeholder="Enter member names"
            required
        >

        <button type="submit">Save Appointment</button>

    </form>

</section>
<div id="appointment-list" class="empty-box">
    <p>No appointments available yet.</p>
    <p>Create your first appointment to get started.</p>
</div>
<script src="script.js"></script>
</body></html>
