# SyncSlot backend configuration
spring.application.name=syncslot-backend

# --- H2 (default, local/demo) ---
spring.datasource.url=jdbc:h2:file:./data/syncslot;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# Jackson: serialize date/time as ISO strings
spring.jackson.serialization.write-dates-as-timestamps=false

server.port=8080

# Demo seed (Alice/Bob/Charlie + Team Catchup). Set to false to disable.
app.seed-demo=true

# H2 web console (optional, useful for inspection: http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- AI explanation (optional, OpenAI-compatible chat completions) ---
# The key is read from the environment: set AI_API_KEY before starting the app.
# Never hardcode a key here. When AI_API_KEY is blank the feature falls back to
# the deterministic scheduling explanation.
app.ai.api-key=${AI_API_KEY:}
app.ai.url=${AI_BASE_URL:https://api.deepseek.com/chat/completions}
app.ai.model=${AI_MODEL:deepseek-chat}
app.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:20}
